plugins {
    id 'com.android.application'
}

android {
    namespace 'com.exemplo.pocketagenda'
    compileSdk 35

    defaultConfig {
        applicationId "com.exemplo.pocketagenda"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
